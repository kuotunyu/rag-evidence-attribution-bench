[project]
name = "rag-evidence-attribution-bench"
version = "0.1.0"
description = "Benchmark for evaluating which context passages a RAG LLM answer actually depends on (HotpotQA distractor, Qwen3)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Steven Tai" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "gradio>=5.0",
]
ml = [
    # torch >=2.7 fails DLL init (WinError 1114, c10.dll) on the Win10 dev machine — see
    # FAILURES.md 2026-07-18. Cap applies to win32 ONLY: Colab must keep its preinstalled
    # CUDA torch and Linux CI/Docker can use current torch.
    "torch>=2.4,<2.7; sys_platform == 'win32'",
    "torch>=2.4; sys_platform != 'win32'",
    "transformers>=4.51",
    "datasets>=3.0",
    "sentence-transformers>=3.0",
    "accelerate>=1.0",
]
gpu = [
    "rag-evidence-attribution-bench[ml]",
    "bitsandbytes>=0.46; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "types-PyYAML",
]

[project.scripts]
rag-evidence = "rag_evidence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_evidence"]

# --- uv: resolve only for the platforms this lock governs (Windows dev, Linux CI/Docker).
# Colab installs via plain pip against PyPI and keeps its preinstalled CUDA torch.
[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["legacy/"]

[[tool.mypy.overrides]]
# Gradio's Blocks API is heavily dynamic; the explorer is UI-only and covered by tests.
module = ["rag_evidence.explorer"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "gradio.*",
    "rank_bm25.*",
    "datasets.*",
    "transformers.*",
    "sentence_transformers.*",
    "bitsandbytes.*",
    "sklearn.*",
    "matplotlib.*",
    "context_cite.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests, excluded in CI",
    "gpu: requires CUDA, never run in CI",
]
addopts = "-ra"
