# Gate A schema-v2 projection of immutable v0.1 smoke artifacts.
run_name: smoke
split: smoke
seed: 42

data:
  hf_path: hotpotqa/hotpot_qa
  hf_config: distractor
  hf_split: validation
  hf_revision: null
  manifest_path: data/manifests/split_manifest.json
  prepared_dir: data/prepared
  split_seed: 20260718
  split_sizes: {smoke: 20, dev: 60, eval: 240}

paths:
  data_dir: data
  results_raw: results/raw
  results_derived: results/v1/derived
  assets_dir: results/v1/assets

retrieval:
  ks: [2, 5, 10]
  rrf_k: 60
  bm25: {k1: 1.5, b: 0.75}
  dense:
    model_id: Qwen/Qwen3-Embedding-0.6B
    batch_size: 8
    max_length: 1024
    normalize: true

generation:
  model_id: Qwen/Qwen3-4B-Instruct-2507
  name: qwen3-4b
  backend: qwen
  dtype: auto
  quantization: none
  fallback_4bit: true
  max_new_tokens: 256
  context_source: dataset
  retrieval_run: null
  top_k_context: 10
  prompt_version: v1

attribution:
  modes: [gold, generated]
  faithfulness: {enabled: true, k: 2}
  embedding: {model_id: Qwen/Qwen3-Embedding-0.6B}
  controls: {retrieval_run: bm25, shuffled_source: leave_one_out}

evaluation:
  attribution_ks: [1, 2, 3]
  primary_k: 2
  correctness_criterion: em
  bootstrap_resamples: 10000
  bootstrap_confidence: 0.95
  bootstrap_tolerance: 0.0
  confirmatory_method: leave_one_out
  primary_comparator: control_lexical

runtime: {device: auto, log_level: INFO}
serve: {mode: precomputed, host: 127.0.0.1, port: 8000}
