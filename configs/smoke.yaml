# Smoke split: 20 questions. End-to-end sanity on Colab T4 in well under an hour.
run_name: smoke
split: smoke
seed: 42

data:
  hf_path: hotpotqa/hotpot_qa
  hf_config: distractor
  hf_split: validation
  hf_revision: null
  manifest_path: data/manifests/split_manifest.json
  prepared_dir: data/prepared
  split_seed: 20260718
  split_sizes:
    smoke: 20
    dev: 60
    eval: 240

paths:
  data_dir: data
  results_raw: results/raw
  results_derived: results/derived
  assets_dir: assets

retrieval:
  ks: [2, 5, 10]
  rrf_k: 60
  bm25:
    k1: 1.5
    b: 0.75
  dense:
    model_id: Qwen/Qwen3-Embedding-0.6B
    batch_size: 8
    max_length: 1024
    normalize: true

generation:
  model_id: Qwen/Qwen3-4B-Instruct-2507
  name: qwen3-4b
  backend: qwen          # qwen | fake (fake stamps execution_kind=mock, never reported)
  dtype: auto            # auto -> bf16 if supported else fp16 on cuda; fp32 on cpu
  quantization: none     # none | 4bit
  fallback_4bit: true    # retry model load in 4-bit on CUDA OOM
  max_new_tokens: 256
  context_source: dataset   # dataset (all 10, dataset order) | retrieval (top-k of retrieval_run)
  retrieval_run: null
  top_k_context: 10
  prompt_version: v1

attribution:
  modes: [gold, generated]
  faithfulness:
    enabled: true
    k: 2
  embedding:
    model_id: Qwen/Qwen3-Embedding-0.6B
  controls:
    retrieval_run: bm25
    shuffled_source: leave_one_out

evaluation:
  attribution_ks: [1, 2, 3]
  primary_k: 2
  correctness_criterion: em   # em | f1_05 (secondary, clearly labeled)

runtime:
  device: auto      # auto | cpu | cuda
  log_level: INFO

serve:
  mode: precomputed  # precomputed | live
  host: 127.0.0.1
  port: 8000
