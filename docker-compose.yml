services:
  explorer:
    # default: `docker compose up` → precomputed benchmark explorer on :8000
    build: .
    ports:
      - "8000:8000"
    environment:
      RAG_EVIDENCE_HOST: 0.0.0.0
    volumes:
      # refresh committed results without rebuilding the image
      - ./results:/app/results:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 25s

  # OPTIONAL, opt-in only: `docker compose --profile gpu up`.
  # Not built by CI; live serve mode is not implemented in v0.1 (see Dockerfile.gpu).
  live-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    ports:
      - "8001:8000"
    environment:
      RAG_EVIDENCE_HOST: 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
